[tool.black]
line-length = 120

# The bot runs with ongabot/ on sys.path and imports by top-level name, e.g.
# `from chat import Chat`. This mirrors the Makefile's exported PYTHONPATH and
# setup.cfg's mypy_path, so a bare `pytest` works without an env-var prefix.
[tool.pytest.ini_options]
pythonpath = ["ongabot"]

[tool.pylint.design]
max-args = 10
max-attributes = 14  # UserStatRow is a flat stats row (one attribute per table column); Event carries the CS2 fields
max-positional-arguments=10

[tool.pylint.format]
max-line-length = 120

[tool.pylint.'SIMILARITIES']
min-similarity-lines=10
ignore-imports=true

[tool.bumpversion]
current_version = "1.9.0"
commit = true
tag = false
tag_name = "v{new_version}"
message = "chore: bump version to {new_version}"

[[tool.bumpversion.files]]
filename = "ongabot/_version.py"
search = "__version__ = \"{current_version}+dev\""
replace = "__version__ = \"{new_version}\""