[flake8]
max-line-length = 120

[mypy]
warn_unused_ignores = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
show_error_codes = True
strict_optional = False
# The bot runs with ongabot/ on sys.path, so its modules import each other by
# top-level name (`from chat import Chat`). mypy_path mirrors that so those
# imports resolve; explicit_package_bases makes mypy derive module names from
# that same root, instead of also deriving ongabot.* names via the package
# __init__.py and failing with "source file found twice".
mypy_path = ongabot
explicit_package_bases = True
# __init__.py is the only module addressed as part of the ongabot package
# (by tests and scripts/version.py); under the top-level naming above its
# relative import resolves to a non-existent __main__._version.
exclude = ongabot/__init__\.py
