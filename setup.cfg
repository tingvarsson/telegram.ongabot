[flake8]
max-line-length = 120

[mypy]
warn_unused_ignores = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
show_error_codes = True
strict_optional = False
# The bot runs with ongabot/ on sys.path and imports by top-level name, e.g.
# `from chat import Chat`. mypy_path mirrors that; explicit_package_bases makes
# mypy name modules from that same root, instead of also deriving ongabot.*
# names via __init__.py and failing with "source file found twice".
mypy_path = ongabot
explicit_package_bases = True
# Excluded because under top-level naming its relative import would resolve to
# a non-existent __main__._version.
exclude = ongabot/__init__\.py
